services:
  mongo-promociones:
    image: mongo:7
    container_name: mongo-promociones
    environment:
      MONGO_INITDB_DATABASE: promociones_db
    networks:
      - plataforma-eventos-net
    volumes:
      - ./seed.js:/docker-entrypoint-initdb.d/seed.js:ro
      - mongo_data:/data/db

volumes:
  mongo_data:

networks:
  plataforma-eventos-net:
    external: true